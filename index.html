
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Calculator</title>
    <style>
        :root {
            --bg-color: #000;
            --display-color: #fff;
            --btn-gray: #333;
            --btn-light-gray: #a5a5a5;
            --btn-orange: #ff9f0a;
            --text-dark: #000;
            --text-white: #fff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #display {
            color: var(--display-color);
            font-size: 80px;
            font-weight: 300;
            text-align: right;
            padding: 20px;
            word-wrap: break-word;
            transition: all 0.1s ease;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            padding-bottom: 40px;
        }

        .btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            font-size: 32px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .gray { background-color: var(--btn-gray); color: var(--text-white); }
        .light-gray { background-color: var(--btn-light-gray); color: var(--text-dark); }
        .orange { background-color: var(--btn-orange); color: var(--text-white); }
        
        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 50px;
            justify-content: flex-start;
            padding-left: 35px;
        }

        /* Responsive scaling for smaller phones */
        @media (max-height: 700px) {
            #display { font-size: 60px; }
            .btn { font-size: 24px; }
            .grid { gap: 8px; }
        }
    </style>
</head>
<body>

    <div id="display">0</div>

    <div class="grid">
        <button class="btn light-gray" onclick="reset()">AC</button>
        <button class="btn light-gray">+/-</button>
        <button class="btn light-gray">%</button>
        <button class="btn orange">÷</button>

        <button class="btn gray" onclick="append(7)">7</button>
        <button class="btn gray" onclick="append(8)">8</button>
        <button class="btn gray" onclick="append(9)">9</button>
        <button class="btn orange">×</button>

        <button class="btn gray" onclick="append(4)">4</button>
        <button class="btn gray" onclick="append(5)">5</button>
        <button class="btn gray" onclick="append(6)">6</button>
        <button class="btn orange" onclick="setOp('+')">−</button>

        <button class="btn gray" onclick="append(1)">1</button>
        <button class="btn gray" onclick="append(2)">2</button>
        <button class="btn gray" onclick="append(3)">3</button>
        <button class="btn orange" onclick="setOp('+')">+</button>

        <button class="btn gray zero" onclick="append(0)">0</button>
        <button class="btn gray">.</button>
        <button class="btn orange" onclick="calculate()">=</button>
    </div>

    <script>
        let currentInput = "0";
        let firstOperand = null;
        let secondOperand = null;
        let operation = null;
        let infiniteInterval = null;

        const display = document.getElementById('display');

        function updateDisplay() {
            let val = parseFloat(currentInput);
            if (isNaN(val)) val = 0;
            
            // Format for display
            if (currentInput.length > 9) {
                display.innerText = val.toExponential(4);
            } else {
                display.innerText = val.toLocaleString();
            }
            
            // Font scaling logic
            if (display.innerText.length > 6) {
                display.style.fontSize = '50px';
            } else {
                display.style.fontSize = '80px';
            }
        }

        function append(num) {
            if (infiniteInterval) clearInterval(infiniteInterval);
            if (currentInput === "0") {
                currentInput = num.toString();
            } else {
                currentInput += num.toString();
            }
            updateDisplay();
        }

        function setOp(op) {
            firstOperand = parseFloat(currentInput);
            operation = op;
            currentInput = "0";
        }

        function reset() {
            currentInput = "0";
            firstOperand = null;
            secondOperand = null;
            operation = null;
            if (infiniteInterval) clearInterval(infiniteInterval);
            updateDisplay();
        }

        function calculate() {
            if (operation === '+' && firstOperand !== null) {
                secondOperand = parseFloat(currentInput);
                let result = firstOperand + secondOperand;
                currentInput = result.toString();
                updateDisplay();

                // Start the infinite addition loop
                if (infiniteInterval) clearInterval(infiniteInterval);
                infiniteInterval = setInterval(() => {
                    result += secondOperand;
                    currentInput = result.toString();
                    updateDisplay();
                }, 1000);
            }
        }
    </script>
</body>
</html>
